ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Server-side code, configuration and data are never served directly.
<DirectoryMatch "^/var/www/html/(includes|config|database|docker)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|\.(sql|env|ini|log|sh|ya?ml|md|lock)$|^Dockerfile$)">
    Require all denied
</FilesMatch>
