# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets marked "sync: false" are entered in the Render dashboard, never in git.
services:
  - type: web
    name: indigenous-heritage
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health.php
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: UPLOAD_MAX_MB
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_CA_PEM
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
